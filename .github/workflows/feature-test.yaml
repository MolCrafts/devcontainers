name: "Test features"
on:
  push:
    branches:
      - master
    paths:
      - 'features/src/**'
      - 'features/test/**'
      - '.github/workflows/feature-test.yaml'
  pull_request:
    paths:
      - 'features/src/**'
      - 'features/test/**'
      - '.github/workflows/feature-test.yaml'
  workflow_dispatch:

concurrency:
  group: feature-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-feature-tests:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.collect.outputs.features }}
    steps:
      - uses: actions/checkout@v4

      - id: collect
        name: "Collect feature test targets"
        run: |
          FEATURE_LIST=$(find features/test -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)
          FEATURES_JSON=$(printf '%s\n' "$FEATURE_LIST" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "features=${FEATURES_JSON}" >> "${GITHUB_OUTPUT}"

  test-features:
    needs: discover-feature-tests
    if: ${{ needs.discover-feature-tests.outputs.features != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJson(needs.discover-feature-tests.outputs.features) }}
    steps:
      - uses: actions/checkout@v4

      - name: "Install devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Test '${{ matrix.feature }}'"
        run: |
          FEATURE_PATH="features/test/${{ matrix.feature }}"
          SCENARIO_FILE="${FEATURE_PATH}/scenarios.json"

          if [ ! -f "${SCENARIO_FILE}" ]; then
            echo "Missing required scenario file: ${SCENARIO_FILE}"
            exit 1
          fi

          if ! jq -e 'type == "object" and length > 0' "${SCENARIO_FILE}" > /dev/null; then
            echo "Scenario file must define at least one scenario: ${SCENARIO_FILE}"
            exit 1
          fi

          echo "Running scenario-based tests for '${{ matrix.feature }}' (skip autogenerated test.sh)."
          devcontainer features test ./features -f ${{ matrix.feature }} --skip-autogenerated
