name: Release

on:
  push:
    branches: [master]
    paths:
      - 'features/**'
      - 'images/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Publish features.
  #
  # Everything downstream depends on this having happened, which is why it is a
  # job in one workflow rather than a separate workflow chained by workflow_run:
  # workflow_run gives no ordering guarantee against a concurrent push, and the
  # old image-release fired on BOTH a paths-filtered push and a workflow_run, so
  # two builds of the same commit raced each other.
  # ---------------------------------------------------------------------------
  publish-features:
    name: Publish features to ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Publish
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./features/src"
          generate-docs: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 2. Verify the meta-features against what was just published.
  #
  # Meta-features are nothing but a dependsOn graph pointing at
  # ghcr.io/molcrafts/devcontainers/*, so they cannot be tested before the
  # toolchain features exist in the registry. This is the earliest point where
  # the test is meaningful — and it is the test that catches a broken edge
  # before anyone opens a container.
  # ---------------------------------------------------------------------------
  verify-meta-features:
    name: "Verify ${{ matrix.feature }} (post-publish)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: publish-features
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        feature: [molpy, molrs, molvis, molexp, molnex]
    steps:
      - uses: actions/checkout@v5

      # Freshly published ghcr packages are private until the package settings
      # are changed. Log in so this job works either way.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: "devcontainer features test -f ${{ matrix.feature }}"
        run: devcontainer features test ./features -f ${{ matrix.feature }} --skip-autogenerated

  # ---------------------------------------------------------------------------
  # 3. Build and push the prebuilt images.
  # ---------------------------------------------------------------------------
  build-images:
    name: "Build ${{ matrix.image }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: verify-meta-features
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: molcrafts-cpu
            # Every install step in this image fetches a prebuilt binary
            # (uv, rustup, cargo-binstall, the CMake tarball, node), all of
            # which publish aarch64 builds — so emulated arm64 stays a
            # download-bound build rather than a compile-bound one. Worth it:
            # most MolCrafts development happens on Apple Silicon.
            platforms: linux/amd64,linux/arm64
          - image: molcrafts-cuda
            # CUDA has no arm64 desktop story worth shipping here.
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Build and push
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < images/VERSION)"
          repo="ghcr.io/molcrafts/devcontainers/images/${{ matrix.image }}"

          echo "Building ${repo} v${version} for ${{ matrix.platforms }}"

          # --platform with more than one value requires --push: a multi-arch
          # manifest cannot be loaded into the local docker image store.
          devcontainer build \
            --workspace-folder "images/${{ matrix.image }}" \
            --platform "${{ matrix.platforms }}" \
            --image-name "${repo}:latest" \
            --image-name "${repo}:${version}" \
            --image-name "${repo}:${{ github.sha }}" \
            --push
